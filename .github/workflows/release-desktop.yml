name: Release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to build (branch or tag)'
        required: true
        default: main
        type: string
      release_tag:
        description: 'Release tag to create or update'
        required: true
        default: v0.3.3
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Select release platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'platforms=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          elif git log -1 --format=%B | grep -Fq '[release-macos]'; then
            echo 'platforms=["macos-latest"]' >> "$GITHUB_OUTPUT"
          elif git log -1 --format=%B "$GITHUB_SHA" | grep -Fq '[release-windows]'; then
            echo 'platforms=["windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Create release before platform publishers start
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: nucrasenaa/itemcode-source
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          TARGET_COMMIT="$(git rev-list -n 1 "$SOURCE_REF")"
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPO" \
              --target "$TARGET_COMMIT" \
              --title "Equality ItemCode Watcher $RELEASE_TAG" \
              --generate-notes
          fi

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      # Keep platform publishers serialized. The release is pre-created above
      # so electron-builder targets the same release instead of racing to
      # create split duplicate releases.
      fail-fast: true
      max-parallel: 1
      matrix:
        os: ${{ fromJSON(needs.prepare-release.outputs.platforms) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop-app/package-lock.json
            equality-itemcode-version/package-lock.json

      - name: Install service dependencies
        working-directory: equality-itemcode-version
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Configure release target
        working-directory: desktop-app
        env:
          RELEASE_REPO: ${{ github.repository }}
        run: >-
          node -e 'const fs=require("fs");const f="package.json";const x=JSON.parse(fs.readFileSync(f,"utf8"));if(x.build&&x.build.publish)x.build.publish.repo=process.env.RELEASE_REPO.split("/")[1];fs.writeFileSync(f,JSON.stringify(x,null,2)+"\n");'

      - name: Test service and desktop
        run: |
          npm --prefix equality-itemcode-version test
          npm --prefix desktop-app run check

      - name: Compile macOS OCR helper
        if: runner.os == 'macOS'
        working-directory: equality-itemcode-version
        run: npm run build:ocr:mac

      - name: Build and publish
        working-directory: desktop-app
        run: >-
          node -e "const cp=require('child_process'),fs=require('fs');const s=JSON.parse(fs.readFileSync('package.json','utf8')).scripts;const script=s['dist:release']?'dist:release':'dist';const npm=process.platform==='win32'?'npm.cmd':'npm';const r=cp.spawnSync(npm,['run',script,'--','--publish','always'],{stdio:'inherit'});process.exit(r.status===null?1:r.status)"
        env:
          # Publish releases to this source repository using the workflow token.
          GH_TOKEN: ${{ github.token }}
